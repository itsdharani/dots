[global/wm]
margin-top    = 0
margin-bottom = 0
include-file = $HOME/.config/polybar/colors.ini
include-file = $HOME/.config/polybar/modules/sys_info.ini
include-file = $HOME/.config/polybar/modules/network.ini
include-file = $HOME/.config/polybar/modules/audio.ini
include-file = $HOME/.config/polybar/modules/util.ini
include-file = $HOME/.config/polybar/modules/misc.ini


[bar/main-bar]
monitor = ${env:MONITOR:}
override-redirect = true

enable-ipc = true

# tray-detached = false
# tray-position = right
# tray-offset-y = -8pt
bottom = false

fixed-center = true

width = 100%
height = 26pt
# offset-x = 98%
# offset-y = 8pt

border-size = 0pt
border-color = ${colors.bg-3}

line-size = 2pt

padding-left = 2pt
padding-right = 2pt

module-margin-left = 0pt
module-margin-right = 0pt

background = ${colors.bg-3}
foreground = ${colors.fg-3}

font-0 = FiraCode Nerd Font:size=12;4
font-1 = FiraCode Nerd Font:size=18;4
font-2 = Symbols Nerd Font:size=22;5
font-3 = Symbols Nerd Font:size=15;4

scroll-up = i3.next
scroll-down = i3.prev

modules-left = left arch xworkspaces-0 right space left filesystem slash cpu slash memory right
modules-center = left xwindows right
modules-right = left pulseaudio slash network slash battery slash time right space power

wm-restack = i3
[settings]
screenschange-reload = true
pseudo-transparency = false
