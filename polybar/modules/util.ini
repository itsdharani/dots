[module/xworkspaces-0]
type = internal/xworkspaces
icon-0 = 1;1
icon-1 = 2;2
icon-2 = 3;3
icon-3 = 4;4
icon-4 = 5;5
icon-5 = 6;6
icon-6 = 7;7
icon-7 = 8;8
icon-8 = 9;9
icon-9 = 10;10

label-active = %icon%
label-active-underline= ${colors.red-2}
label-active-background = ${colors.bg-2}
label-active-foreground= ${colors.red-3}
label-active-padding = 2

label-occupied = %icon%
label-occupied-padding = 2
label-occupied-background = ${colors.bg-1}
label-occupied-foreground = ${colors.blue-3}
label-occupied-underline = ${colors.blue-2}

label-urgent = %icon%
label-urgent-background = ${colors.bg-1}
label-urgent-foreground = ${colors.red-1}
label-urgent-padding = 2

label-empty = %icon%
label-empty-background = ${colors.bg-1}
label-empty-foreground = ${colors.fg-1}
label-empty-padding = 2


[module/xwindows]
type = internal/xwindow
label = "  %title:0:72:...%  "
format-background = ${colors.bg-1}
format-foreground = ${colors.fg-2}
label-maxlen = 50


[module/date]
type = internal/date
interval = 5
label-underline = ${colors.red-2}
label-background = ${colors.bg-1}
label-foreground = ${colors.fg-3}
time = %d %b
label = " %time% "


[module/time]
type = internal/date
interval = 1
format-prefix = "󰅐 "
format-prefix-underline = ${colors.blue-2}
format-prefix-background = ${colors.bg-1}
format-prefix-foreground = ${colors.blue-3}
label-underline = ${colors.blue-2}
label-background = ${colors.bg-1}
label-foreground = ${colors.fg-3}
time = %H:%M
label = "%time% "
