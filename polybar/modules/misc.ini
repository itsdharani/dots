[module/slash]
type = custom/text
format = " / "
format-background = ${colors.bg-1}
format-foreground = ${colors.fg-1}
format-font = 1

[module/line]
type = custom/text
format = |
format-background = ${colors.bg-1}
format-foreground = ${colors.fg-3}
format-font = 3


[module/space]
type = custom/text
format = "  "
format-background = ${colors.bg-3}
format-foreground = ${colors.bg-3}

[module/arch]
type = custom/text
format = "   "
format-background = ${colors.bg-1}
format-foreground = ${colors.green-2}
format-font = 3

[module/power]
type = custom/text
format = "  ⏻  "
format-background = ${colors.bg-2}
format-foreground = ${colors.red-2}
format-font = 3
click-left = i3-nagbar -t warning -m 'Exit i3?' -B 'Logout' 'i3-msg exit' -B 'Reboot' 'systemctl reboot' -B 'Shutdown' 'systemctl poweroff'


[module/left]
type = custom/text
format-background = ${colors.bg-3}
format-foreground = ${colors.bg-1}
format-font = 2
format = %{T3}%{T-}

[module/right]
type = custom/text
format-background = ${colors.bg-3}
format-foreground = ${colors.bg-1}
format-font = 2
format = %{T3}%{T-}
