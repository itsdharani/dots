exec-once = swww-daemon
exec-once = hypridle
exec-once = waybar
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = hyprsunset

monitor = eDP-1,1920x1080@60,0x0,1.25
monitor=HDMI-A-1,1920x1080@60,0x0,1.0,mirror,eDP-1

$mainMod = SUPER
$terminal = kitty
$fileManager = dolphin
$menu = wofi --show drun
$shotDir = ~/Pictures/Screenshots 

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = MOZ_ENABLE_WAYLAND,1

general {
    
    snap {
        enabled = true
    }
    
    layout = dwindle


    gaps_in = 8
    gaps_out = 8
    border_size = 2

col.active_border = rgba(89b4faff) rgba(a6e3a1ff) 45deg
col.inactive_border = rgba(45475aff) rgba(313244ff) 45deg



resize_on_border = true
    allow_tearing = false
}



decoration {
    rounding = 20
    rounding_power = 9.0
    active_opacity = 1
    inactive_opacity = 0.9
    fullscreen_opacity = 1
     
    dim_inactive = false

    border_part_of_window = true

    shadow {
        enabled = true

    }

    blur {
        enabled = true
        size = 25
        passes = 3
        vibrancy = 0.25
        noise = 0.01
        xray = true
    }

    shadow {
        enabled = true
        range = 10
    }
}


animations {
    enabled = yes
    workspace_wraparound = true

    bezier = smoothOut, 0.05, 0.9, 0.1, 1.05
    bezier = smoothIn, 0.3, 0.0, 0.8, 0.15

    animation = windows, 1, 6, smoothOut
    animation = windowsOut, 1, 5, smoothIn, popin 80%
    animation = fade, 1, 6, default
    animation = border, 1, 8, default
    animation = workspaces, 1, 6, smoothOut, slide
}


input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
        tap-to-click = true
    }
}


dwindle {
    preserve_split = yes
    smart_split = true
}


master {
    new_on_top = true
    mfact = 0.55
}


gesture = 3, horizontal, workspace 

gesture = 3, down, close

gesture = 3, up, scale: 1.15, fullscreen


misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
    vrr = 1
}


bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, A, exec, $menu
bind = $mainMod, Q, killactive
bind = $mainMod, F, fullscreen
bind = $mainMod, V, togglefloating
bind = $mainMod, W, exec, ~/.config/hypr/scripts/wallpaper.sh
bind = $mainMod, M, exec, wlogout -b 2

# Waybar
bind = $mainMod, B, exec, pkill waybar || waybar

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Focus
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod SHIFT, mouse:272, resizewindow


bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +2%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -2%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle

bind = , XF86MonBrightnessUp, exec, brightnessctl set +1%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 1%-

bind = $mainMod, P, exec, grimblast --notify copysave screen ~/Pictures/Screenshots/screenshot-$(date +'%Y-%m-%d_%H-%M-%S').png
bind = ALT, K, exec, wf-recorder -f ~/Videos/recording_$(date +%s).mp4
bind = ALT, L, exec, pkill wf-recorder
bind = ALT, T, exec, ~/.config/hypr/scripts/shutdown.sh
bind = $mainMod SHIFT, P, exec, bash -c 'next=1; while [ -f "$shotDir/img-$next.png" ]; do ((next++)); done; grimblast --notify copysave area "$shotDir/img-$next.png"'
